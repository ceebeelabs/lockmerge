[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ceebeelabs/lockmerge"
publish = false

# `panic = "abort"` must never be set in a profile that builds the `lockmerge`
# binary: the driver relies on `catch_unwind` (ADR 0013).
