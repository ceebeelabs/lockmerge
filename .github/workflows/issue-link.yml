name: issue link

# pull_request_target runs this workflow file from the default branch, and the
# job below checks out only the base commit, so nothing a pull request changes
# is executed here. The pull request's own copy of the script is tested in
# issue-link-self-test.yml.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-link:
    name: issue link
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check the issue link
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-issue-link.sh
