name: adr lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  adr-lint:
    name: adr lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Self-test the check
        run: .github/scripts/check-adrs.sh --self-test
      - name: Check the records
        run: .github/scripts/check-adrs.sh
