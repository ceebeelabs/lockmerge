source = "Hand-built reduction: a workspace of members app and tool; crate names and checksums are synthetic. Ours adds the registry crate alpha 1.0.0 to app and theirs adds beta 2.0.0 to tool. The index cache file(s) under index/ are written by hand in the layout of docs/formats/cargo-registry-index.md (header 03 02 00 00 00, then version and JSON records), not taken from a real cache. Every input has the git crate native-g, which app depends on. Both sides hold it, so it cannot collide with what only one side added (ADR 0020); neighbors: refuse-git-id-on-ours and refuse-git-id-on-theirs, where a git id is added."
path = "Cargo.lock"
outcome = "merged"
applied = ["cargo.E1", "cargo.C", "cargo.C", "core.B3", "core.B2", "core.B3", "core.B1", "core.B2", "cargo.V2", "cargo.V3", "cargo.V4", "cargo.V6", "cargo.V5"]
