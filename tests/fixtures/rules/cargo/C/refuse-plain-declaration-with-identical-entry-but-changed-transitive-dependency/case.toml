source = "Hand-built reduction of accept-plain-declaration-of-a-held-crate-with-identical-entry; checksums are synthetic. itoa depends on mid, which depends on leaf. Theirs moves leaf from 1.0.0 to 1.0.1 and rand to 0.9.0; ours adds a plain declaration of itoa to tool. The entry of itoa is identical in both lockfiles, but the crate below it differs, so a feature itoa forwards could reach leaf (ADR 0020, transitive coverage)."
path = "Cargo.lock"
outcome = "refused"
code = "cargo.FEATURES"
