# The ratchet of `lockmerge-bench check` (docs/02-oracle.md section 5, ADR 0006).
# First baseline: the rate measured when the corpus was first extracted
# (2026-11-21, before the manifest rules of #37). Lowering a value needs the
# owner's review.
min_cases = 56
min_reachable = 54
# The reachable resolution rate must be at least min_rate_resolved / min_rate_of.
min_rate_resolved = 0
min_rate_of = 1
max_unverified = 0
# The regression ratchet (ADR 0017): git-clean-correct cases lockmerge refuses.
# It may only go down. The first value is the count measured on the corpus
# above (47 refusals of git-clean-correct cases); the v1 release check needs
# at most 5% of git-clean-correct cases.
max_regressions = 47
