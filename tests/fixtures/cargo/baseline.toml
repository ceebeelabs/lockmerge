# The ratchet of `lockmerge-bench check` (docs/02-oracle.md section 5, ADR 0006).
# The first real baseline is the rate measured when the corpus is first
# extracted. Lowering a value needs the owner's review.
min_cases = 0
min_reachable = 0
# The reachable resolution rate must be at least min_rate_resolved / min_rate_of.
min_rate_resolved = 0
min_rate_of = 1
max_unverified = 0
# The regression ratchet (ADR 0017): git-clean-correct cases lockmerge refuses.
# It may only go down; the first real value is the count measured when the
# corpus is first extracted.
max_regressions = 0
