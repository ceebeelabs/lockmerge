# lockmerge-core is pure (ADR 0011): no processes, no files, no environment.
# Side effects live in lockmerge-env.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "core is pure; spawn processes in lockmerge-env" },
    { path = "std::process::exit", reason = "core is pure; exit codes belong to lockmerge-cli" },
    { path = "std::process::abort", reason = "core is pure; exit codes belong to lockmerge-cli" },
    { path = "std::process::id", reason = "core is pure" },
    { path = "std::fs::read", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::read_to_string", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::read_dir", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::read_link", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::metadata", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::symlink_metadata", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::canonicalize", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::exists", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::write", reason = "core is pure; never write files" },
    { path = "std::fs::copy", reason = "core is pure; never write files" },
    { path = "std::fs::rename", reason = "core is pure; never write files" },
    { path = "std::fs::remove_file", reason = "core is pure; never write files" },
    { path = "std::fs::remove_dir", reason = "core is pure; never write files" },
    { path = "std::fs::remove_dir_all", reason = "core is pure; never write files" },
    { path = "std::fs::create_dir", reason = "core is pure; never write files" },
    { path = "std::fs::create_dir_all", reason = "core is pure; never write files" },
    { path = "std::fs::hard_link", reason = "core is pure; never write files" },
    { path = "std::env::var", reason = "core is pure; read the environment in lockmerge-env" },
    { path = "std::env::var_os", reason = "core is pure; read the environment in lockmerge-env" },
    { path = "std::env::vars", reason = "core is pure; read the environment in lockmerge-env" },
    { path = "std::env::vars_os", reason = "core is pure; read the environment in lockmerge-env" },
    { path = "std::env::args", reason = "core is pure; arguments belong to lockmerge-cli" },
    { path = "std::env::args_os", reason = "core is pure; arguments belong to lockmerge-cli" },
    { path = "std::env::current_dir", reason = "core is pure" },
    { path = "std::env::current_exe", reason = "core is pure" },
    { path = "std::env::temp_dir", reason = "core is pure" },
    { path = "std::env::set_current_dir", reason = "core is pure" },
    { path = "std::env::set_var", reason = "core is pure" },
    { path = "std::env::remove_var", reason = "core is pure" },
]
disallowed-types = [
    { path = "std::process::Command", reason = "core is pure; spawn processes in lockmerge-env" },
    { path = "std::process::Child", reason = "core is pure; spawn processes in lockmerge-env" },
    { path = "std::fs::File", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::OpenOptions", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::DirEntry", reason = "core is pure; read files in lockmerge-env" },
    { path = "std::fs::ReadDir", reason = "core is pure; read files in lockmerge-env" },
]
