[package]
name = "lockmerge-cargo"
description = "Cargo.lock format of lockmerge: parser, resolved model, base rules and canonical writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lockmerge-core = { path = "../lockmerge-core" }
# Read-only parsing (ADR 0014). Without the `display` feature the crate has no
# TOML writer at all, so no output can come from it.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
semver = "1"
# Parses the JSON of a registry index entry (docs/formats/cargo-registry-index.md).
serde_json = "1"

[dev-dependencies]
lockmerge-core = { path = "../lockmerge-core", features = ["testkit"] }
